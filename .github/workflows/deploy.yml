name: Deploy to iFastNet

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # TEMPORARY - remove this step once the connection issue is diagnosed.
      # Prints the character count of FTP_SERVER, not the value itself, so it's
      # safe to leave in a log. "ftp.coffepoint.ifree.page" is 25 characters -
      # a bigger number here means a trailing space/newline is hiding in the secret.
      - name: Debug FTP_SERVER length
        run: echo -n "${{ secrets.FTP_SERVER }}" | wc -c

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /s/census/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/schema.sql
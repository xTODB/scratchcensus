name: Deploy to iFastNet

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # This FTP account's own home directory is already /s/census/ (unlike
          # the main site's account, whose home is the site root) - so this
          # deploys straight into it, not another nested /s/census/ inside it.
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/schema.sql